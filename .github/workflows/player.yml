name: GBA player checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  player:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q playwright==1.55.0
      - if: matrix.engine == 'webkit'
        run: python -m playwright install --with-deps webkit > /tmp/webkit-install.log
      - run: python tests/player.py ${{ matrix.engine }}
      - if: matrix.engine == 'chromium'
        run: SOAK_SECONDS=35 python tests/soak.py
  live:
    if: github.ref_name == 'main'
    needs: player
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q playwright==1.55.0
      - run: python tests/player.py chromium --live
  endurance:
    if: github.event_name == 'workflow_dispatch' || (github.ref_name == 'sp-player-upgrades' && contains(github.event.head_commit.message, '[soak]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q playwright==1.55.0
      - name: Play FireRed for two hours and verify the last save offline
        run: python tests/soak.py
