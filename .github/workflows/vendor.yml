name: Package pinned browser runtime
on:
  push:
    branches: [sp-player-upgrades]
    paths: ['scripts/vendor_runtime.py']
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/vendor_runtime.py
      - name: Add verified packages to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor
          if ! git diff --cached --quiet; then
            git commit -m "Vendor pinned browser dependencies and mGBA core"
            git push origin HEAD:sp-player-upgrades
          fi
